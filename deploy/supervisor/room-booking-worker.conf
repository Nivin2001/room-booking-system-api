; Template only. Replace paths and service account for the target host.
; Keep queue retry_after greater than worker timeout and Supervisor stopwaitsecs.
[program:room-booking-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/srv/room-booking-api/current
command=/usr/bin/php /srv/room-booking-api/current/artisan queue:work redis --queue=default --sleep=3 --tries=5 --timeout=120 --max-time=3600 --max-jobs=1000
user=room-booking
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=150
redirect_stderr=true
stdout_logfile=/var/log/room-booking/worker-%(process_num)02d.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
