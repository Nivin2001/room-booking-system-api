# Template only: replace every booking.example.invalid hostname, release path,
# PHP-FPM socket, and certificate path after checking the target host.
# The unknown-host TLS block requires Nginx 1.19.4+ for ssl_reject_handshake.

# Reject unrecognized HTTP Host headers. The canonical virtual host below is
# the only one that serves the app or the ACME challenge.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name booking.example.invalid;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://booking.example.invalid$request_uri;
    }
}

# Reject unknown TLS SNI/Host names before serving any application content.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name booking.example.invalid;
    root /srv/room-booking-api/current/public;
    index index.php;
    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/booking.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Only Laravel's front controller is executable.
    location ~ \.php$ {
        return 404;
    }

    location ~* ^/(?:\.env|\.git|vendor|bootstrap|database|resources|routes|tests|config)(?:/|$) {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
